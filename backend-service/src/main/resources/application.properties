# =============================================================
# Urban Digital Twin AI - Spring Boot Backend Configuration
# =============================================================

# ----------------------------------------------------------
# MySQL Database Configuration
# ----------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/urbantwindb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Pravee@2005

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# FIX: Disable open-in-view to prevent DB queries during view rendering (removes WARN log)
spring.jpa.open-in-view=false

# ----------------------------------------------------------
# SQL Init (role seeding on startup)
# ----------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ----------------------------------------------------------
# JWT App Properties
# ----------------------------------------------------------
bezkoder.app.jwtSecret=======================UrbanDigitalTwinAI===========================
bezkoder.app.jwtExpirationMs=86400000

# ----------------------------------------------------------
# Server Port
# ----------------------------------------------------------
server.port=8081

# ----------------------------------------------------------
# File Upload Limits (for 3D model ingestion)
# ----------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ----------------------------------------------------------
# CORS (allow frontend dev server on both Vite ports)
# ----------------------------------------------------------
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# ----------------------------------------------------------
# Flask AI Service URL (injected via @Value in controllers)
# ----------------------------------------------------------
flask.ai.url=http://localhost:5000/api/v1/predict/emissions